{% load static %}
<section class="py-16 md:py-24 bg-cover bg-center" style="background-image: url('https://image_0.png');">
  <div class="container mx-auto px-4 md:px-6">
    <h2 class="text-center text-3xl md:text-4xl font-bold tracking-tight text-white mb-12">O que nossos clientes dizem</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
      {% for dp in depoimento %}
      <div class="bg-white/80 p-8 rounded-2xl shadow-lg border-2 border-green-500/50 flex flex-col justify-between">
        <svg class="h-10 w-10 text-green-500 opacity-50 mb-4" fill="currentColor" viewBox="0 0 32 32">
          <path d="M10 12h-4v-4h4zM10 20h-4v-4h4zM22 12h-4v-4h4zM22 20h-4v-4h4z" />
        </svg>

        <p class="text-gray-700 leading-relaxed mb-6">{{ dp.comentario }}</p>

        <div class="flex items-center gap-4 mt-auto">
          <img src="{{ dp.foto.url }}" alt="{{ dp.nome }}" class="h-16 w-16 rounded-full object-cover border-4 border-green-500 shadow-md">
          <div>
            <p class="font-semibold text-gray-900">{{ dp.nome }}</p>
            <p class="text-sm text-gray-500">Cliente desde {{ dp.cliente_desde }}</p>
            </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
