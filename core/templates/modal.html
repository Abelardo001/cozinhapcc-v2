 {% load static %}
 <div id="orderModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/60 px-4">
      <div class="w-full max-w-2xl rounded-xl bg-white p-6 shadow-2xl md:p-8 animate-in fade-in zoom-in duration-200">
        <div class="flex items-center justify-between mb-6">
          <h3 class="text-2xl font-bold">Fazer Encomenda</h3>
          <button class="close-modal text-gray-500 hover:text-gray-800" aria-label="Fechar modal">
            <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <form class="grid grid-cols-1 gap-6 md:grid-cols-2">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium" for="modal-name">Nome completo</label>
            <input class="mt-1 block w-full rounded-lg border-gray-300 focus:border-primary focus:ring-primary" id="modal-name" type="text" required>
          </div>
          <div>
            <label class="block text-sm font-medium" for="modal-phone">Telefone</label>
            <input class="mt-1 block w-full rounded-lg border-gray-300 focus:border-primary focus:ring-primary" id="modal-phone" type="tel" required>
          </div>
          <div>
            <label class="block text-sm font-medium" for="modal-address">Endereço</label>
            <input class="mt-1 block w-full rounded-lg border-gray-300 focus:border-primary focus:ring-primary" id="modal-address" type="text" required>
          </div>

          <div class="md:col-span-2">
            <p class="text-sm text-text-muted flex items-center gap-2">
              <svg class="h-5 w-5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
              O pagamento é feito na entrega • Entrega em até 40 minutos
            </p>
          </div>

          <div class="md:col-span-2 flex gap-4">
            <button type="button" class="close-modal flex-1 h-12 rounded-lg border border-gray-300 font-bold text-text-main hover:bg-gray-50">
              Cancelar
            </button>
            <button type="submit" class="flex-1 h-12 rounded-lg bg-primary font-bold text-white shadow-lg hover:bg-primary/90">
              Confirmar Encomenda
            </button>
          </div>
        </form>
      </div>
    </div>
